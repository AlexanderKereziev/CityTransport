<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="tran.svg" type="image/svg+xml">
    <title>Линии - Градски Транспорт</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- 1. Главна навигация -->
    <header>
        <div class="brand">
            <img src="tran.svg" alt="Лого на Градски Транспорт" class="logo">
            <h2>Градски Транспорт</h2>
        </div>

        <nav>
            <a href="index.html">Начало</a>
            <a href="plan.html">Планиране</a>
            <a href="lines.html" class="active">Линии</a>
            <a href="stops.html">Спирки</a>
            <a href="schedules.html">Разписания</a>
            <a href="contact.html">Контакти</a>
        </nav>
    </header>

    <hr>

    <!-- 2. Основна част -->
    <main>
        <!-- Търсене на линия -->
        <section>
            <h3>Търсене на линия</h3>
            <form id="searchForm">
                <input type="text" id="lineQuery" name="line_query" placeholder="Въведете номер на линия...">
                <button type="submit">Търси линия</button>
            </form>
        </section>

        <br>

        <!-- Списък с линии -->
        <section>
            <h3>Всички транспортни линии</h3>
            
            <!-- Динамичен контейнер за картите -->
            <div id="linesContainer">
                <!-- Данните от Firebase се зареждат тук -->
            </div>
        </section>
    </main>

    <hr>

    <!-- 3. Футър -->
    <footer>
        <p>&copy; 2026 Градски Транспорт - Екип 1, XII "В" клас</p>
    </footer>

    <!-- Локален скрипт за логиката на тази страница -->
    <script type="module">
        // Импортираме инстанцията на db от вашия готов файл (променете 'firebase-config.js' с името на вашия файл)
        import { getLines } from "./firebase.js";

        const linesContainer = document.getElementById("linesContainer");
        const searchForm = document.getElementById("searchForm");
        const lineInput = document.getElementById("lineQuery");

        // Рендериране на картата с вашата HTML структура
        function renderCard(data) {
            const badgeClass = data.type === "Тролей" ? "line-trolley" : "line-bus";
            
            return `
                <div class="route-card">
                    <div class="route-header">
                        <span class="badge ${badgeClass}">${data.type} № ${data.lineNumber}</span>
                        <span class="route-time">Интервал: ${data.intervalMinutes} мин.</span>
                    </div>
                    <div class="route-details">
                        <p><strong>Маршрут:</strong> ${data.route}</p>
                        <p class="route-stops-count">Брой спирки: ${data.stopsCount}</p>
                    </div>
                    <a href="schedules.html?line=${data.lineNumber}" class="btn-details">Виж разписание &rarr;</a>
                </div>
            `;
        }

        // Зареждане на всички линии
        async function loadLines() {
            linesContainer.innerHTML = "<p>Зареждане на линиите...</p>";

            try {
                const lines = await getLines();

                linesContainer.innerHTML = "";

                if (lines.length === 0) {
                    linesContainer.innerHTML = "<p>Няма намерени линии.</p>";
                    return;
                }

                lines.forEach(line => {
                    linesContainer.innerHTML += renderCard(line);
                });

            } catch (error) {
                console.error("Грешка при зареждане:", error);
                linesContainer.innerHTML = "<p>Грешка при зареждане на данните.</p>";
            }
        }

        // Търсене на линия
        async function searchLine(event) {
            event.preventDefault();

            const queryVal = lineInput.value.trim();

            if (!queryVal) {
                loadLines();
                return;
            }

            try {
                const lines = await getLines();

                const results = lines.filter(line =>
                    String(line.lineNumber) === queryVal
                );

                linesContainer.innerHTML = "";

                if (results.length === 0) {
                    linesContainer.innerHTML = "<p>Няма намерена линия с този номер.</p>";
                    return;
                }

                results.forEach(line => {
                    linesContainer.innerHTML += renderCard(line);
                });

            } catch (error) {
                console.error("Грешка при търсене:", error);
                linesContainer.innerHTML = "<p>Грешка при изпълнение на търсенето.</p>";
            }
        }

        searchForm.addEventListener("submit", searchLine);
        document.addEventListener("DOMContentLoaded", loadLines);
    </script>
</body>
</html>
