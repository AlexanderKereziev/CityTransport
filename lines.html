
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="tran.svg" type="image/svg+xml">
    <title data-i18n="linesPageTitle">Линии - Градски Транспорт</title>
    <link rel="stylesheet" href="main.css">
    <script src="translations.js" defer></script>
</head>
<body>
<header>
    <div class="brand">
        <img
            src="tran.svg"
            alt="Лого на Градски Транспорт"
            class="logo"
            data-i18n-alt="brand"
        >
        <h2 data-i18n="brand">Градски Транспорт</h2>
    </div>

    <nav>
        <a href="index.html" data-i18n="home">Начало</a>
        <a href="plan.html" data-i18n="planning">Планиране</a>
        <a href="lines.html" class="active" data-i18n="lines">Линии</a>
        <a href="tran.html" data-i18n="transfers">Трансфери</a>
        <a href="stops.html" data-i18n="stops">Спирки</a>
        <a href="schedules.html" data-i18n="schedules">Разписания</a>
        <a href="contact.html" data-i18n="contacts">Контакти</a>

        <button id="language-toggle" type="button">🇬🇧 English</button>
    </nav>
</header>

<hr>

<main>
    <section>
        <h3 data-i18n="searchLineTitle">Търсене на линия</h3>

        <form id="searchForm">
            <input
                type="text"
                id="lineQuery"
                name="line_query"
                placeholder="Въведете номер или вид транспорт..."
                data-i18n-placeholder="lineSearchPlaceholder"
            >

            <button type="submit" data-i18n="searchLineButton">
                Търси линия
            </button>

            <button type="button" id="resetButton" data-i18n="showAllButton">
                Покажи всички
            </button>
        </form>
    </section>

    <br>

    <section>
        <h3 data-i18n="allLinesTitle">Всички транспортни линии</h3>

        <div id="linesContainer">
            <p data-i18n="loadingLines">Зареждане на линиите...</p>
        </div>
    </section>
</main>

<hr>

<footer>
    <p data-i18n="linesFooter">
        © 2026 Градски Транспорт - Екип 1, XII "В" клас
    </p>
</footer>

<script type="module">
    import { getLines, getStops } from "./firebase.js";

    const linesContainer = document.getElementById("linesContainer");
    const searchForm = document.getElementById("searchForm");
    const lineInput = document.getElementById("lineQuery");
    const resetButton = document.getElementById("resetButton");

    let allLines = [];
    let allStops = [];

    const escapeHTML = value => String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[character]
    );

    function getStopId(entry) {
        if (typeof entry === "string" || typeof entry === "number") {
            return String(entry);
        }

        if (entry && typeof entry === "object") {
            return String(
                entry.stopId ??
                entry.stop_id ??
                entry.id ??
                entry.docId ??
                entry.code ??
                ""
            );
        }

        return "";
    }

    function getRouteNames(line) {
        if (!Array.isArray(line.route)) {
            return [];
        }

        return line.route.map(entry => {
            const stopId = getStopId(entry);

            const stop = allStops.find(item =>
                String(item.id) === stopId
            );

            return stop
                ? stop.name
                : `${getTranslation("unknownStop")} (${stopId})`;
        });
    }

    function getTransportType(type) {
        const normalized = String(type ?? "").toLocaleLowerCase("bg");

        if (normalized.includes("тролей")) {
            return getTranslation("trolleybus");
        }

        if (normalized.includes("автобус") || normalized.includes("bus")) {
            return getTranslation("bus");
        }

        return type || getTranslation("transport");
    }

    function getTransportClass(type) {
        const normalized = String(type ?? "").toLocaleLowerCase("bg");

        if (normalized.includes("тролей")) {
            return "line-trolley";
        }

        return "line-bus";
    }

    function renderCard(line) {
        const lineNumber = escapeHTML(line.lineNumber ?? "");
        const type = escapeHTML(getTransportType(line.type));
        const routeNames = getRouteNames(line);

        const stopsCount = line.stopsCount ?? (
            Array.isArray(line.route) ? line.route.length : 0
        );

        const routeHTML = routeNames.length
            ? routeNames.map(escapeHTML).join(" → ")
            : escapeHTML(getTranslation("noRouteData"));

        const badgeClass = getTransportClass(line.type);

        return `
            <div class="route-card">
                <div class="route-header">
                    <span class="badge ${badgeClass}">
                        ${type} № ${lineNumber}
                    </span>
                </div>

                <div class="route-details">
                    <p>
                        <strong>${escapeHTML(getTranslation("routeLabel"))}</strong>
                        ${routeHTML}
                    </p>

                    <p class="route-stops-count">
                        ${escapeHTML(getTranslation("stopsCount"))}
                        ${escapeHTML(stopsCount)}
                    </p>
                </div>

                <a
                    href="schedules.html?line=${encodeURIComponent(line.lineNumber ?? "")}"
                    class="btn-details"
                >
                    ${escapeHTML(getTranslation("viewSchedule"))} &rarr;
                </a>
            </div>
        `;
    }

    function displayLines(lines) {
        if (!lines.length) {
            linesContainer.innerHTML =
                `<p>${escapeHTML(getTranslation("noLinesFound"))}</p>`;
            return;
        }

        linesContainer.innerHTML = lines
            .map(renderCard)
            .join("");
    }

    async function loadLines() {
        linesContainer.innerHTML =
            `<p>${escapeHTML(getTranslation("loadingLines"))}</p>`;

        try {
            const [lines, stops] = await Promise.all([
                getLines(),
                getStops()
            ]);

            allLines = Array.isArray(lines) ? lines : [];
            allStops = Array.isArray(stops) ? stops : [];

            allLines.sort((a, b) =>
                String(a.lineNumber ?? "").localeCompare(
                    String(b.lineNumber ?? ""),
                    "bg",
                    { numeric: true }
                )
            );

            displayLines(allLines);

            console.log("Заредени линии:", allLines);
            console.log("Заредени спирки:", allStops);

        } catch (error) {
            console.error("Грешка при зареждане:", error);

            linesContainer.innerHTML =
                `<p>${escapeHTML(getTranslation("linesLoadError"))}</p>`;
        }
    }

    function searchLine(event) {
        event.preventDefault();

        const query = lineInput.value
            .trim()
            .toLocaleLowerCase("bg");

        if (!query) {
            displayLines(allLines);
            return;
        }

        const results = allLines.filter(line => {
            const number = String(line.lineNumber ?? "")
                .toLocaleLowerCase("bg");

            const type = String(line.type ?? "")
                .toLocaleLowerCase("bg");

            return number.includes(query) || type.includes(query);
        });

        displayLines(results);
    }

    function resetSearch() {
        lineInput.value = "";
        displayLines(allLines);
    }

    searchForm.addEventListener("submit", searchLine);
    resetButton.addEventListener("click", resetSearch);

    // Re-render Firebase-generated cards when the language changes.
    document.addEventListener("languageChanged", () => {
        const query = lineInput.value.trim();

        if (!query) {
            displayLines(allLines);
            return;
        }

        searchLine(new Event("submit", { cancelable: true }));
    });

    loadLines();
</script>

</body>
</html>
